[build]
  command = "npm run build"
  publish = "dist"

# Production reads onyx through the same-origin /rpc path. Override with
# VITE_RPC / VITE_CHAIN_ID / VITE_WALLET_RPC / VITE_GNOWEB for another chain.
[build.environment]
  VITE_CHAIN_ID = "onyx-1"
  VITE_WALLET_RPC = "https://rpc.onyx.testnets.gno.land:443"
  VITE_GNOWEB = "https://onyx.testnets.gno.land"

[[redirects]]
  from = "/rpc"
  to = "https://rpc.onyx.testnets.gno.land:443"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://rpc.onyx.testnets.gno.land https://rpc.gno.land https://indexer.onyx.testnets.gno.land https://api.audius.co https://*.audius.co https://archive.org https://*.archive.org https://ipfs.io https://arweave.net; media-src 'self' https: blob:; img-src 'self' https: data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
