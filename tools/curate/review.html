<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GnoRadio curation review</title>
<style>
:root{--bg:#e9e9e6;--card:#fafaf8;--ink:#0d0d0d;--mute:#8a8a86;--line:#e3e3df;--red:#e5432f;--keep:#0d0d0d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;padding:24px}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.panel{background:var(--card);border-radius:22px;padding:24px}
h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px;font-weight:600}
h1 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:3px}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:12px;color:var(--mute);margin:16px 0 6px}
select,input[type=file]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.counts div{background:#ececea;border-radius:12px;padding:10px}
.counts b{display:block;font-size:26px;letter-spacing:-.03em;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:500 15px inherit;cursor:pointer;margin-top:10px}
.btn.dark{background:var(--ink);color:#fafaf8}.btn.grey{background:#e3e3df}
.keys{margin-top:16px;font-size:12px;color:var(--mute);line-height:1.8}
kbd{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.now{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.cover{width:220px;aspect-ratio:1;border-radius:18px;background:#d9d7d2;object-fit:cover;display:block}
.big{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:#ececea;border-radius:8px;padding:5px 9px;font-size:12px}
.tag.warn{background:#fde6e2;color:#a02a1b}
.time{font-size:64px;font-weight:500;letter-spacing:-.05em;line-height:1}
.time span{color:#c4c4c0}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.actions button{height:72px;border:0;border-radius:16px;font:500 16px inherit;cursor:pointer}
.k{background:var(--ink);color:#fafaf8}.d{background:#e3e3df}.s{background:#fff;border:1px solid var(--line)!important}
.attrib{font-size:12px;color:var(--mute);margin-top:14px;word-break:break-word}
.list{margin-top:20px;max-height:360px;overflow:auto;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) 90px 60px;gap:10px;padding:8px 4px;border-bottom:1px solid #ececea;font-size:13px;cursor:pointer}
.row.cur{background:#fff}
.row .st{width:10px;height:10px;border-radius:50%;margin-top:5px;background:#d9d7d2}
.row .st.keep{background:var(--ink)}.row .st.drop{background:var(--red)}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
@media (max-width:820px){.app{grid-template-columns:1fr}.now{grid-template-columns:1fr}.cover{width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Curation<i></i></h1>
    <p class="mute">Listen, keep or drop. Only kept tracks go on-chain.</p>
    <label for="file">candidates.json</label>
    <input id="file" type="file" accept="application/json">
    <label for="fsrc">Source</label>
    <select id="fsrc"><option value="">All</option><option>archive</option><option>ccmixter</option><option>audius</option></select>
    <label for="fgenre">Genre</label>
    <select id="fgenre"><option value="">All</option></select>
    <label for="fstate">Show</label>
    <select id="fstate"><option value="todo">Not reviewed</option><option value="">All</option><option value="keep">Kept</option><option value="drop">Dropped</option></select>
    <div class="counts"><div><b id="cTodo">0</b><span class="mute">to review</span></div><div><b id="cKeep">0</b><span class="mute">kept</span></div><div><b id="cDrop">0</b><span class="mute">dropped</span></div></div>
    <button class="btn dark" id="export" type="button">Export approved.json</button>
    <button class="btn grey" id="reset" type="button">Forget decisions</button>
    <div class="keys"><kbd>K</kbd> keep · <kbd>D</kbd> drop · <kbd>Space</kbd> play/pause · <kbd>→</kbd> skip 10 s · <kbd>N</kbd>/<kbd>P</kbd> next/prev · <kbd>1</kbd>–<kbd>9</kbd>,<kbd>0</kbd> set genre 1–10, with <kbd>Shift</kbd> 11–20</div>
  </aside>
  <main class="panel" id="main">
    <div class="empty" id="empty">Open <b>candidates.json</b> (or serve this folder with <code>python3 -m http.server</code> and it loads by itself).</div>
    <div id="view" hidden>
      <div class="now">
        <img class="cover" id="cover" alt="">
        <div>
          <span class="mute" id="artist"></span>
          <div class="big" id="title"></div>
          <div class="tags" id="tags"></div>
          <div class="time" id="time"><span>0</span>0:00</div>
          <span class="mute" id="dur"></span>
          <div class="actions"><button class="k" id="bk" type="button">Keep</button><button class="d" id="bd" type="button">Drop</button><button class="s" id="bs" type="button">Skip</button></div>
          <div class="attrib" id="attrib"></div>
        </div>
      </div>
      <audio id="audio" preload="none"></audio>
      <div class="list" id="list"></div>
    </div>
  </main>
</div>
<script>
const GENRES=["","Electronica","Synthwave","Ambient","Techno","House","Drum & Bass","Dubstep & Trap","Lo-fi Beats","Hip-hop & Rap","R&B & Soul","Rock & Indie","Metal & Punk","Pop","Jazz & Blues","Folk & Acoustic","Cinematic & Classical","World","Latin","Reggae & Dub","Funk & Disco"];
const STORE="gnoradio-curation";
let all=[],shown=[],idx=0,dec={};
try{dec=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){dec={}}
const $=id=>document.getElementById(id);
const key=c=>c.source+":"+c.source_id;
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(dec))}catch(e){}};
GENRES.forEach((g,i)=>{if(i){const o=document.createElement("option");o.value=i;o.textContent=i+" · "+g;$("fgenre").appendChild(o)}});

function audioURL(c){
  if(c.source==="audius")return "https://api.audius.co/v1/tracks/"+c.source_id+"/stream?app_name=GnoRadio";
  return c.mirror_audio||c.audio;
}
function setData(list){all=list;$("empty").hidden=true;$("view").hidden=false;filter()}
function filter(){
  const s=$("fsrc").value,g=$("fgenre").value,st=$("fstate").value;
  shown=all.filter(c=>{const d=dec[key(c)];const gen=(d&&d.genre)||c.genre;
    return (!s||c.source===s)&&(!g||String(gen)===g)&&(!st||(st==="todo"?!d||!d.state:d&&d.state===st))});
  idx=0;render();counts();
}
function counts(){let k=0,d=0;all.forEach(c=>{const x=dec[key(c)];if(x&&x.state==="keep")k++;else if(x&&x.state==="drop")d++});$("cKeep").textContent=k;$("cDrop").textContent=d;$("cTodo").textContent=all.length-k-d}
function render(){
  const list=$("list");list.innerHTML="";
  shown.forEach((c,i)=>{const r=document.createElement("div");r.className="row"+(i===idx?" cur":"");const d=dec[key(c)]||{};
    r.innerHTML='<span class="st '+(d.state||"")+'"></span><span></span><span class="mute"></span><span class="mute"></span>';
    r.children[1].textContent=c.title+" · "+c.artist;r.children[2].textContent=GENRES[d.genre||c.genre]||"";r.children[3].textContent=c.duration;
    r.onclick=()=>{idx=i;render();play()};list.appendChild(r)});
  const c=shown[idx];if(!c){$("title").textContent="All done";$("artist").textContent="";$("tags").innerHTML="";$("attrib").textContent="";$("cover").removeAttribute("src");return}
  const d=dec[key(c)]||{};
  $("title").textContent=c.title;$("artist").textContent=c.artist;
  if(c.cover)$("cover").src=c.cover;else $("cover").removeAttribute("src");
  const tags=[[c.source],[GENRES[d.genre||c.genre]],[c.license],[c.kbps?c.kbps+" kbps":""]];
  if(c.low_bitrate)tags.push(["low bitrate","warn"]);if(c.needs_mirror)tags.push(["needs mirror","warn"]);if(!c.cover)tags.push(["no artwork","warn"]);
  $("tags").innerHTML="";tags.forEach(([t,w])=>{if(!t)return;const s=document.createElement("span");s.className="tag"+(w?" "+w:"");s.textContent=t;$("tags").appendChild(s)});
  $("dur").textContent="of "+c.duration+(d.state?" · "+d.state:"");
  $("attrib").textContent=c.attribution;
}
function play(){const c=shown[idx];if(!c)return;const a=$("audio");a.src=audioURL(c);
  a.onloadedmetadata=()=>{a.currentTime=Math.min(a.duration*0.3,Math.max(0,a.duration-30))};a.play().catch(()=>{})}
function decide(state){const c=shown[idx];if(!c)return;const k=key(c);dec[k]=Object.assign({},dec[k],{state});save();counts();next()}
function next(){if(idx<shown.length-1){idx++;render();play()}else render()}
function prev(){if(idx>0){idx--;render();play()}}
function setGenre(g){const c=shown[idx];if(!c)return;const k=key(c);dec[k]=Object.assign({},dec[k],{genre:g});save();render()}
$("audio").ontimeupdate=()=>{const t=Math.floor($("audio").currentTime),m=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");const lead=m.match(/^[0:]*/)[0];$("time").innerHTML="<span>"+lead+"</span>"+m.slice(lead.length)};
$("bk").onclick=()=>decide("keep");$("bd").onclick=()=>decide("drop");$("bs").onclick=next;
["fsrc","fgenre","fstate"].forEach(id=>$(id).onchange=filter);
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>setData(JSON.parse(t)))};
$("reset").onclick=()=>{dec={};save();filter()};
$("export").onclick=()=>{
  const out=all.filter(c=>(dec[key(c)]||{}).state==="keep").map(c=>Object.assign({},c,{genre:(dec[key(c)]||{}).genre||c.genre}));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download="approved.json";a.click()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;const k=e.key.toLowerCase();
  if(k==="k")decide("keep");else if(k==="d")decide("drop");else if(k==="n")next();else if(k==="p")prev();
  else if(k===" "){e.preventDefault();const a=$("audio");if(!a.src)play();else a.paused?a.play():a.pause()}
  else if(k==="arrowright"){$("audio").currentTime+=10}
  else if(/^Digit\d$/.test(e.code))setGenre((Number(e.code[5])||10)+(e.shiftKey?10:0))});
fetch("candidates.json").then(r=>r.ok?r.json():null).then(d=>{if(d)setData(d)}).catch(()=>{});
</script>
</body>
</html>
